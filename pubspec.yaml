name: houras_marble_erp
description: "Houras Marble & Granite Workshop ERP - a premium cross-platform ERP built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Charts
  fl_chart: ^0.68.0

  # Animations
  flutter_animate: ^4.5.0
  animations: ^2.0.11

  # UI
  responsive_framework: ^1.5.1
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

  # Icons
  font_awesome_flutter: ^10.7.0

  # Tables
  data_table_2: ^2.5.15

  # Files
  file_picker: ^8.0.3

  # PDF & export
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.3

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4

  # Networking (REST API / sync)
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.2
  crypto: ^3.0.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
